<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nefi Solitaires - Mátrix Labor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <div id="top-area">
            <div id="stock-pile" class="pile"></div>
            <div id="waste-pile" class="pile"></div>
            <div id="foundations">
                <div class="foundation" data-suit="♠"></div>
                <div class="foundation" data-suit="♥"></div>
                <div class="foundation" data-suit="♣"></div>
                <div class="foundation" data-suit="♦"></div>
            </div>
        </div>

        <div id="table"></div>
    </div>

    <div id="controls">
        <button id="undo-btn">Vissza</button>
        <button id="new-game-btn">Új leosztás</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
